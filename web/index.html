<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一体化企业智能助手</title>
<style>
  :root {
    --brand: #4f6ef7;
    --brand-2: #7c5cfc;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e6eaf2;
    --bg: #f4f6fb;
    --card: #ffffff;
    --ok: #16a34a;
    --warn: #b45309;
    --danger: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #edf1fb 0%, #f7f9fd 60%);
    color: var(--ink);
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 72px; }

  /* ---------- 顶部 ---------- */
  header { display: flex; align-items: center; justify-content: space-between;
           flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 12px; flex: none;
          background: linear-gradient(135deg, var(--brand), var(--brand-2));
          color: #fff; display: flex; align-items: center; justify-content: center;
          font-size: 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(79,110,247,.35); }
  header h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  header h1 .sub { display: block; font-size: 12px; color: var(--muted);
                   font-weight: 400; margin-top: 2px; }
  .head-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: #eef1f7;
           color: var(--muted); font-weight: 500; }
  .badge.ok { background: #e7f7ec; color: var(--ok); }
  .badge.bad { background: #fdeaea; color: var(--danger); }
  .badge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                margin-right: 6px; background: currentColor; }
  .key-field { display: flex; align-items: center; gap: 6px; }
  input[type=password].key { width: 170px; padding: 6px 10px; font-size: 12px;
      border: 1px solid var(--line); border-radius: 8px; outline: none; background: #fff; }
  input[type=password].key:focus { border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79,110,247,.15); }

  /* ---------- 页签 ---------- */
  .tabs { display: inline-flex; gap: 4px; background: #fff; padding: 5px; border-radius: 13px;
          box-shadow: 0 2px 10px rgba(15,23,42,.06); margin-bottom: 20px; }
  .tabs button { padding: 9px 22px; font-size: 15px; border: none; border-radius: 9px;
                 background: transparent; color: var(--muted); cursor: pointer;
                 transition: all .18s ease; font-family: inherit; }
  .tabs button:hover { color: var(--brand); background: #f1f4fd; }
  .tabs button.active { background: linear-gradient(135deg, var(--brand), var(--brand-2));
                        color: #fff; font-weight: 600; box-shadow: 0 3px 10px rgba(79,110,247,.32); }
  .panel { display: none; animation: fade .25s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- 输入卡片 ---------- */
  .box { background: var(--card); border-radius: 16px; padding: 20px;
         box-shadow: 0 2px 12px rgba(15,23,42,.06); }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  input[type=text] { flex: 1; padding: 12px 16px; font-size: 15px; border: 1px solid var(--line);
                     border-radius: 11px; outline: none; background: #fbfcff; transition: all .18s ease; }
  input[type=text]:focus, textarea:focus { border-color: var(--brand);
                     background: #fff; box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
  textarea { width: 100%; padding: 12px 16px; font-size: 15px; border: 1px solid var(--line);
             border-radius: 11px; outline: none; resize: vertical; min-height: 74px;
             background: #fbfcff; font-family: inherit; transition: all .18s ease; }
  .btn { padding: 12px 26px; font-size: 15px; color: #fff; border: none; border-radius: 11px;
         background: linear-gradient(135deg, var(--brand), var(--brand-2)); cursor: pointer;
         white-space: nowrap; font-weight: 600; letter-spacing: .5px;
         box-shadow: 0 4px 12px rgba(79,110,247,.28); transition: all .18s ease; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,110,247,.4); }
  .btn:active { transform: none; }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.small { padding: 7px 14px; font-size: 13px; border-radius: 8px; }
  .btn.gray { background: #94a3b8; box-shadow: none; font-weight: 500; }
  .btn.gray:hover { background: #7d8ba1; }
  .btn.gray.warn { background: #d97706; box-shadow: 0 4px 12px rgba(217,119,6,.3);
                   padding: 7px 12px; white-space: normal; line-height: 1.25; }
  .btn.gray.warn:hover { background: #b45309; }
  .examples { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .examples button { margin: 5px 8px 0 0; padding: 5px 13px; font-size: 13px; color: var(--brand);
                     background: #f0f4ff; border: 1px solid #dbe3fd; border-radius: 999px;
                     cursor: pointer; transition: all .15s ease; }
  .examples button:hover { background: #e3eafe; border-color: var(--brand); }

  /* ---------- 知识库文档管理 ---------- */
  .doc-manager { margin-top: 14px; padding: 12px 14px; background: #f8faff;
                 border: 1px solid var(--line); border-radius: 11px; }
  .doc-manager-head { display: flex; align-items: center; justify-content: space-between;
                      margin-bottom: 8px; font-size: 13px; color: #334155; }
  .doc-list { display: flex; flex-direction: column; gap: 6px; }
  .doc-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
              padding: 7px 11px; background: #fff; border: 1px solid var(--line);
              border-radius: 9px; font-size: 13px; }
  .doc-item .doc-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .doc-name-btn { padding: 0; border: 0; background: none; text-align: left; cursor: pointer;
                  font-size: 13px; color: #1e293b; word-break: break-all; font-family: inherit; }
  .doc-name-btn:hover { color: var(--brand); }
  .doc-name-btn .caret { display: inline-block; width: 14px; color: var(--muted); }
  .doc-meta-line { color: var(--muted); font-size: 12px; word-break: break-all; }
  .doc-chunks { margin: -2px 0 8px 12px; padding: 8px 11px; background: #fff;
                border: 1px dashed #dbe3fd; border-radius: 9px; }
  .chunk-item { padding: 7px 2px; border-bottom: 1px dashed #eef1f8; }
  .chunk-item:last-child { border-bottom: 0; }
  .chunk-item.hit { background: #fff7e0; border-radius: 6px; }
  .chunk-head { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
                margin-bottom: 3px; }
  .chunk-head .chunk-no { color: var(--brand); font-weight: 600; }
  .chunk-text { font-size: 12.5px; color: #334155; white-space: pre-wrap; word-break: break-word; }
  .chunk-pager { display: flex; align-items: center; gap: 10px; margin-top: 8px;
                 font-size: 12px; color: var(--muted); }
  .chunk-pager button:disabled { opacity: .45; cursor: not-allowed; }
  .doc-del { padding: 3px 11px; font-size: 12px; color: #dc2626; background: #fff;
             border: 1px solid #fecaca; border-radius: 7px; cursor: pointer;
             white-space: nowrap; transition: all .15s ease; }
  .doc-del:hover { background: #fef2f2; border-color: #fca5a5; }
  .doc-del:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 结果区 ---------- */
  .result { margin-top: 18px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px;
          box-shadow: 0 2px 12px rgba(15,23,42,.06); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card h3 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .3px;
             text-transform: uppercase; }
  .explain { font-size: 15px; white-space: pre-wrap; }
  .chips span { display: inline-block; margin: 0 6px 6px 0; padding: 3px 11px; font-size: 12px;
                background: #f3f5fb; border: 1px solid var(--line); border-radius: 999px;
                font-family: Consolas, monospace; color: #475569; }
  .sql-wrap { position: relative; }
  pre.sql { background: #131a2a; color: #dbe4f3; padding: 16px 18px; border-radius: 12px;
            font-family: Consolas, "Courier New", monospace; font-size: 13px;
            overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .copy-btn { position: absolute; top: 10px; right: 10px; padding: 5px 12px; font-size: 12px;
              color: #cbd5e1; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
              border-radius: 7px; cursor: pointer; transition: all .15s ease; }
  .copy-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .error { background: #fdf0f0; border: 1px solid #f6caca; color: var(--danger);
           padding: 12px 16px; border-radius: 11px; font-size: 14px; }
  .warn { font-size: 12px; color: var(--warn); background: #fdf6ec; border: 1px solid #f3dfb8;
          padding: 8px 13px; border-radius: 9px; margin-top: 8px; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .table-scroll { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 9px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { background: linear-gradient(180deg, #f8fafd, #f1f4fa); font-weight: 600; color: #475569;
       position: sticky; top: 0; }
  td { color: #334155; }
  tbody tr:hover { background: #f5f8ff; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .loading { color: var(--brand); font-size: 14px; padding: 24px 0; text-align: center; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #dfe5f3;
             border-top-color: var(--brand); border-radius: 50%; vertical-align: -4px;
             margin-right: 9px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answer { font-size: 15px; white-space: pre-wrap; }
  .cite { font-size: 12px; color: var(--muted); margin-top: 12px; padding-top: 12px;
          border-top: 1px dashed var(--line); }
  .cite b { font-weight: 600; }
  .cite span, .cite button { display: inline-block; margin: 3px 6px 0 0; padding: 3px 10px;
               background: #f3f5fb; border: 0; border-radius: 8px; font-size: 12px;
               color: var(--muted); font-family: inherit; }
  .cite button { cursor: pointer; }
  .cite button:hover { background: #e8eefc; color: var(--brand); }
  .file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type=file] { font-size: 13px; color: var(--muted); }
  .file-row .hint { font-size: 13px; color: var(--muted); }
  .link, .dl-btn { color: var(--brand); text-decoration: none; font-weight: 600; }
  .dl-btn { display: inline-block; margin-top: 8px; padding: 9px 16px; color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            border-radius: 9px; box-shadow: 0 3px 10px rgba(79,110,247,.28); }
  .empty { color: var(--muted); text-align: center; padding: 10px 0; font-size: 14px; }
  .mini-btn { font-size: 12px; padding: 4px 12px; color: var(--brand); background: #f0f4ff;
              border: 1px solid #dbe3fd; border-radius: 7px; cursor: pointer; transition: all .15s ease; }
  .mini-btn:hover { background: #e3eafe; border-color: var(--brand); }
  .history { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .history .h-label { margin-right: 4px; }
  .h-chip { display: inline-block; margin: 4px 8px 0 0; padding: 3px 11px; font-size: 12px;
            background: #fff; border: 1px dashed var(--line); border-radius: 999px; cursor: pointer;
            color: #475569; transition: all .15s ease; }
  .h-chip:hover { border-color: var(--brand); color: var(--brand); background: #f6f8ff; }
  .h-clear { cursor: pointer; color: var(--muted); margin-left: 2px; }
  .h-clear:hover { color: var(--danger); }

  /* ---------- 登录页 ---------- */
  .login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center;
                padding: 20px; }
  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 18px;
                padding: 38px 32px; box-shadow: 0 10px 40px rgba(15,23,42,.12); text-align: center; }
  .login-card .logo { width: 58px; height: 58px; margin: 0 auto 16px; font-size: 24px;
                      border-radius: 15px; }
  .login-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 26px; }
  .login-card input { width: 100%; margin-bottom: 12px; padding: 12px 16px; font-size: 15px;
                      border: 1px solid var(--line); border-radius: 11px; outline: none; background: #fbfcff; }
  .login-card input:focus { border-color: var(--brand); background: #fff;
                            box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
  .login-card .btn { width: 100%; }
  .login-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 14px; }
  .login-hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
  .login-switch { font-size: 13px; text-align: center; margin-top: 14px; }
  .login-switch a { color: var(--brand); text-decoration: none; }

  @media (max-width: 640px) {
    .row { flex-direction: column; }
    .btn { width: 100%; }
    header { flex-direction: column; align-items: flex-start; }
    .tabs { display: flex; width: 100%; }
    .tabs button { flex: 1; padding: 9px 8px; }
  }
</style>
</head>
<body>
<!-- 登录 / 注册视图 -->
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="logo">AI</div>
    <h2 id="authTitle">一体化企业智能助手</h2>
    <p class="login-sub" id="authSub">登录后开始使用</p>
    <input id="loginAccount" type="text" placeholder="用户名（字母/数字/下划线/连字符）" autocomplete="username">
    <input id="loginKey" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
    <input id="regConfirm" type="password" placeholder="确认密码" autocomplete="new-password" style="display:none;">
    <input id="regDisplay" type="text" placeholder="显示名（可选）" style="display:none;">
    <button id="loginBtn" class="btn">登 录</button>
    <div class="login-switch"><a id="modeToggle" href="javascript:void(0)">没有账号？注册</a></div>
    <div id="loginMsg" class="login-msg"></div>
    <div id="loginHint" class="login-hint">请输入用户名与密码。首次启动可用服务日志中打印的 admin 初始密码登录，登录后请立即修改密码。</div>
  </div>
</div>

<!-- 修改密码视图 -->
<div id="pwdView" class="login-view" style="display:none;">
  <div class="login-card">
    <h2>修改密码</h2>
    <p class="login-sub">修改成功后旧令牌失效，需要重新登录</p>
    <input id="pwdOld" type="password" placeholder="旧密码" autocomplete="current-password">
    <input id="pwdNew" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password">
    <input id="pwdConfirm" type="password" placeholder="确认新密码" autocomplete="new-password">
    <button id="pwdBtn" class="btn">确认修改</button>
    <button id="pwdCancel" class="btn gray small" style="width:100%;margin-top:10px;">返回</button>
    <div id="pwdMsg" class="login-msg"></div>
  </div>
</div>

<!-- 主视图（登录后显示） -->
<div id="mainView" class="wrap" style="display:none;">
  <header>
    <div class="brand">
      <div class="logo">AI</div>
      <h1>一体化企业智能助手
        <span class="sub">数据问答 · 知识问答</span>
      </h1>
    </div>
    <div class="head-tools">
      <span id="healthBadge" class="badge"><span class="dot"></span>正在检查服务…</span>
      <span id="loginBadge" class="badge ok"><span class="dot"></span>已登录</span>
      <button id="changePwdBtn" class="btn gray small">改密</button>
      <button id="logoutBtn" class="btn gray small">登出</button>
    </div>
  </header>

  <div class="tabs">
    <button data-tab="sql" class="active">数据问答</button>
    <button data-tab="rag">知识问答</button>
  </div>

  <!-- ============ 面板 1：SQL 取数（主） ============ -->
  <div id="panel-sql" class="panel active">
    <div class="box">
      <div class="file-row" style="margin-bottom:6px;">
        <span class="hint">数据源</span>
        <b id="dsName">加载中…</b>
        <span id="dsMeta" class="hint"></span>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <button id="dsDemoBtn" class="mini-btn" type="button">接入示例库</button>
        <input type="file" id="dsSqliteFile" accept=".db,.sqlite,.sqlite3" style="display:none">
        <button id="dsUploadBtn" class="mini-btn" type="button">上传 SQLite</button>
        <button id="dsRefreshBtn" class="mini-btn" type="button">刷新扫描</button>
        <button id="dsDisconnectBtn" class="mini-btn" type="button">断开</button>
        <span id="dsMsg" class="hint"></span>
      </div>
      <details id="dsTables" style="display:none;margin-bottom:10px;">
        <summary id="dsTablesSummary" style="cursor:pointer;font-size:13px;">表清单与排除原因</summary>
        <div id="dsTablesBody" class="hint" style="margin-top:6px;white-space:pre-wrap;"></div>
      </details>
      <div class="file-row" style="margin-bottom:8px;">
        <input type="file" id="dataUploadFile" accept=".xlsx,.xlsm,.csv,.db,.sqlite,.sqlite3">
        <button id="dataUploadBtn" class="btn gray small" type="button">上传并识别</button>
        <span class="hint">表格文件建表，SQLite 直接接入</span>
      </div>
      <div id="dataUploadCard" style="margin:0 0 10px;"></div>
      <div class="row">
        <input id="sqlQ" type="text" placeholder="例如：当前在制工单有多少批？" autocomplete="off">
        <button id="sqlBtn" class="btn">提 问</button>
      </div>
      <div class="examples">
        试试：
        <button data-q="当前在制工单有多少批？">在制批数</button>
        <button data-q="各客户正式订单销售额排名">客户销售额排名</button>
        <button data-q="本月准时交付率是多少？">本月OTD</button>
        <button data-q="工单260600002的整体RTY是多少？">单工单RTY</button>
        <button data-q="本月报废率是多少？">本月报废率</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <span id="sqlMemInfo" class="hint">会话记忆：0 轮（可追问「再按部门分组」）</span>
        <button id="sqlMemClear" class="mini-btn" type="button">清空会话</button>
      </div>
      <div id="sqlHistory" class="history"></div>
    </div>
    <div id="sqlResult" class="result"></div>
  </div>

  <!-- ============ 面板 2：知识问答（RAG） ============ -->
  <div id="panel-rag" class="panel">
    <div class="box">
      <div class="row">
        <input id="ragQ" type="text" placeholder="针对知识库提问，例如：北斗三号何时开通全球服务？">
        <button id="ragBtn" class="btn">提 问</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <span id="ragMemInfo" class="hint">会话记忆：0 轮（支持「那它的精度呢」这类追问）</span>
        <button id="ragMemClear" class="mini-btn" type="button">清空会话</button>
      </div>
      <div class="file-row">
        <input type="file" id="ragFile" accept=".pdf,.docx,.doc,.md,.markdown,.txt,.json,.jsonl,.html,.htm,.xlsx,.xlsm,.csv">
        <button id="ragIngestBtn" class="btn gray small" type="button">上传并识别</button>
        <span id="ragIngestMsg" class="hint"></span>
      </div>
      <div id="ragUploadCard" style="margin:0 0 10px;"></div>
      <div class="file-row">
        <input type="date" id="ragDocDate" title="文档日期（可选，YYYY-MM-DD）">
        <input type="text" id="ragDocVersion" placeholder="版本号（可选，如 v2.0）" maxlength="16" style="max-width:170px;">
        <span class="hint">冲突仲裁字段（可选）：版本冲突时按此采信更新的一方；口径冲突时不据此裁决，仅标注来源</span>
      </div>
      <div class="file-row">
        <input type="file" id="ragFolder" webkitdirectory multiple>
        <button id="ragBatchBtn" class="btn gray small">批量导入</button>
        <span id="ragBatchMsg" class="hint"></span>
      </div>
      <div class="doc-manager">
        <div class="doc-manager-head">
          <b>知识库文档</b>
          <button id="ragRefreshBtn" class="mini-btn" type="button">刷新</button>
        </div>
        <div id="ragDocs" class="doc-list"><span class="hint">加载中…</span></div>
      </div>
      <div id="ragHistory" class="history"></div>
    </div>
    <div id="ragResult" class="result"></div>
  </div>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

/* 登录签发的访问令牌：受保护接口一律带 Authorization，服务端只认令牌里的身份 */
function authToken() { return localStorage.getItem("token") || ""; }

/* 会话 id：前端生成一次，存 sessionStorage（标签页级）；服务端按 (用户, 会话) 存记忆 */
var SESSION_ID = (function () {
  var id = sessionStorage.getItem("chat_session_id");
  if (!id) {
    if (window.crypto && crypto.randomUUID) {
      id = crypto.randomUUID().replace(/-/g, "");
    } else {
      id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
    sessionStorage.setItem("chat_session_id", id);
  }
  return id;
})();

function authHeaders(extra) {
  var h = extra || {};
  var t = authToken();
  if (t) h["Authorization"] = "Bearer " + t;
  h["X-Session-Id"] = SESSION_ID;   // 三个技能共用同一套会话记忆
  return h;
}
/* 解析 JWT payload（只读展示/过期判断，不验签；验签由服务端负责） */
function tokenPayload() {
  var parts = authToken().split(".");
  if (parts.length !== 3) return null;
  try {
    var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch (e) { return null; }
}
/* 登录态 = 令牌存在且未过期（留 5 秒时钟偏差），不再只看"有没有 token 字符串" */
function tokenValid() {
  var p = tokenPayload();
  if (!p || !p.exp) return false;
  return p.exp * 1000 > Date.now() + 5000;
}
function clearSession() {
  localStorage.removeItem("token");
  localStorage.removeItem("account");
  localStorage.removeItem("api_key");
}
/* 401 统一处理：清空登录态并回到登录页（令牌过期/被篡改/被吊销） */
var _expiredOnce = false;
function expireSession() {
  if (_expiredOnce) return;
  _expiredOnce = true;
  clearSession();
  showLogin();
  $("loginMsg").textContent = "登录已过期，请重新登录";
}
/* 所有受保护请求的唯一入口：自动带 Bearer，401 统一触发一次兜底 */
function apiFetch(url, opts) {
  var init = {};
  opts = opts || {};
  for (var k in opts) { if (Object.prototype.hasOwnProperty.call(opts, k)) init[k] = opts[k]; }
  init.headers = authHeaders(opts.headers || {});
  return fetch(url, init).then(function (r) {
    if (r.status === 401) {
      expireSession();
      throw new Error("登录已过期，请重新登录");
    }
    return r;
  });
}
/* JSON 请求：401 上面已处理；其余非 2xx 提取服务端 detail 抛错 */
function apiJson(url, opts) {
  return apiFetch(url, opts).then(function (r) {
    if (r.ok) return r.json();
    return r.text().then(function (t) {
      var msg = "HTTP " + r.status;
      try { var j = JSON.parse(t); if (j.detail) msg = j.detail; } catch (e) {}
      throw new Error(msg);
    });
  });
}

/* 登录账号（知识库按账号隔离，仅用于展示；身份以令牌为准） */
function userId() { return localStorage.getItem("account") || ""; }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function loading(text) {
  return '<div class="card"><div class="loading"><span class="spinner"></span>' + esc(text) + "</div></div>";
}

/* ---------- SSE 状态进度流（POST + 手写解析，EventSource 不支持 POST） ---------- */
function streamSSE(url, headers, body, on) {
  return apiFetch(url, { method: "POST", headers: headers, body: JSON.stringify(body) })
    .then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) {
          var msg = "HTTP " + r.status;
          try { var j = JSON.parse(t); if (j.detail) msg = j.detail; } catch (e) {}
          throw new Error(msg);
        });
      }
      if (!r.body) throw new Error("当前浏览器不支持流式响应");
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      function handleBlock(block) {
        var evt = "message", data = "";
        block.split("\n").forEach(function (line) {
          if (line.indexOf("event:") === 0) evt = line.slice(6).trim();
          else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
        });
        if (!data) return;
        var payload;
        try { payload = JSON.parse(data); } catch (e) { return; }
        if (evt === "status" && on.status) on.status(payload);
        else if (evt === "final" && on.final) on.final(payload);
        else if (evt === "error" && on.error) on.error(payload.error || "服务端处理失败");
      }
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) return;
          buf += decoder.decode(res.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            handleBlock(buf.slice(0, idx));
            buf = buf.slice(idx + 2);
          }
          return pump();
        });
      }
      return pump();
    });
}

/* ---------- 通用复制 ---------- */
function copyText(btn, text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      var old = btn.textContent; btn.textContent = "已复制";
      setTimeout(function () { btn.textContent = old; }, 1500);
    });
  } else {
    btn.textContent = "复制失败";
  }
}
function copySql(btn) {
  var pre = btn.closest(".card").querySelector("pre.sql");
  copyText(btn, pre ? pre.textContent : "");
}
function copyAnswer(btn) {
  var el = btn.closest(".card").querySelector(".answer");
  copyText(btn, el ? el.textContent : "");
}

/* ---------- 查询历史（localStorage，最近 8 条） ---------- */
function getHist(key) { try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; } }
function renderHist(key) {
  var map = { sql_history: ["sqlHistory", "sqlQ", askSql], rag_history: ["ragHistory", "ragQ", askRag] };
  var cfg = map[key]; if (!cfg) return;
  var el = $(cfg[0]); if (!el) return;
  var arr = getHist(key);
  if (!arr.length) { el.innerHTML = ""; return; }
  el.innerHTML = '<span class="h-label">最近：</span>' +
    arr.map(function (q) { return '<span class="h-chip">' + esc(q) + '</span>'; }).join("") +
    '<span class="h-clear">清空</span>';
  Array.prototype.forEach.call(el.querySelectorAll(".h-chip"), function (chip) {
    chip.addEventListener("click", function () { $(cfg[1]).value = chip.textContent; cfg[2](); });
  });
  el.querySelector(".h-clear").addEventListener("click", function () {
    localStorage.removeItem(key); renderHist(key);
  });
}
function pushHist(key, q) {
  var arr = getHist(key).filter(function (x) { return x !== q; });
  arr.unshift(q); arr = arr.slice(0, 8);
  localStorage.setItem(key, JSON.stringify(arr));
  renderHist(key);
}

/* ---------- 页签切换 ---------- */
var tabs = document.querySelectorAll(".tabs button");
tabs.forEach(function (btn) {
  btn.addEventListener("click", function () {
    tabs.forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    var t = btn.getAttribute("data-tab");
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
    $("panel-" + t).classList.add("active");
    if (t === "rag") loadRagDocs();
  });
});

/* ============ 面板 1：SQL 取数 ============ */
function isNumericColumn(name, rows, colIdx) {
  if (!rows.length) return false;
  var numericLike = /qty|amount|price|rate|rty|fpy|count|num|金额|数量|率|颗|批|排板|分钟|天$/i;
  if (numericLike.test(name)) return true;
  return rows.slice(0, 5).every(function (r) {
    return r[colIdx] === null || r[colIdx] === "" || !isNaN(Number(r[colIdx]));
  });
}
function renderSql(data) {
  var html = "";
  if (data.clarify) {
    sqlClarifyOrig = data.question || $("sqlQ").value.trim();
    html += '<div class="card"><h3>需要你补充一点信息</h3>' +
            '<div class="explain">' + esc(data.clarify) + "</div>";
    if (data.picked_tables && data.picked_tables.length) {
      html += '<div class="chips" style="margin-top:8px;">';
      data.picked_tables.forEach(function (t) { html += "<span>" + esc(t) + "</span>"; });
      html += "</div>";
    }
    html += '<textarea id="sqlClarifyInput" rows="2" placeholder="补充信息后点提交（Enter 发送，Shift+Enter 换行）" style="margin-top:12px;"></textarea>' +
            '<div style="margin-top:10px;"><button id="sqlClarifyBtn" class="btn">提交补充</button></div></div>';
    $("sqlResult").innerHTML = html;
    var ta = $("sqlClarifyInput");
    ta.focus();
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askSqlClarify(); }
    });
    $("sqlClarifyBtn").addEventListener("click", askSqlClarify);
    return;
  }
  sqlClarifyOrig = null;
  if (data.error) html += '<div class="card"><div class="error">' + esc(data.error) + "</div></div>";
  if (data.from_memory) {
    html += '<div class="card"><h3>来自对话记忆</h3><div class="explain">' + esc(data.explanation || "") + "</div></div>";
  } else if (data.explanation) {
    html += '<div class="card"><h3>口径说明</h3><div class="explain">' + esc(data.explanation).replace(/\n/g, "<br>") + "</div></div>";
  }
  if (data.rewritten_question) {
    html += '<div class="hint">结合上文，本轮按「' + esc(data.rewritten_question) + '」生成 SQL</div>';
  }
  if (data.memory_turns) {
    updateMemInfo("sqlMemInfo", data.memory_turns, "可继续追问「再按部门分组」");
  }
  if (data.picked_tables && data.picked_tables.length) {
    html += '<div class="card"><h3>命中数据表（Schema Linking）</h3><div class="chips">';
    data.picked_tables.forEach(function (t) { html += "<span>" + esc(t) + "</span>"; });
    html += "</div></div>";
  }
  if (data.sql) {
    html += '<div class="card"><div class="card-head"><h3>生成的 SQL（已通过只读守卫）</h3></div>' +
            '<div class="sql-wrap"><button class="copy-btn" onclick="copySql(this)">复制</button>' +
            '<pre class="sql">' + esc(data.sql) + "</pre></div>";
    (data.warnings || []).forEach(function (w) { html += '<div class="warn">⚠ ' + esc(w) + "</div>"; });
    html += "</div>";
  }
  if (data.columns && data.columns.length) {
    html += '<div class="card"><div class="card-head"><h3>查询结果</h3>' +
            '<span class="meta" style="margin:0;">共 ' + data.row_count + " 行" +
            (data.model ? "　模型：" + esc(data.model) : "") +
            (data.truncated ? "　（结果过多已截断）" : "") + "</span></div>";
    html += '<div class="table-scroll"><table><thead><tr><th class="num" style="width:42px;">#</th>';
    data.columns.forEach(function (c, i) { html += "<th" + (isNumericColumn(c, data.rows, i) ? ' class="num"' : "") + ">" + esc(c) + "</th>"; });
    html += "</tr></thead><tbody>";
    data.rows.forEach(function (row, ri) {
      html += '<tr><td class="num" style="color:#94a3b8;">' + (ri + 1) + "</td>";
      row.forEach(function (v, i) { html += "<td" + (isNumericColumn(data.columns[i], data.rows, i) ? ' class="num"' : "") + ">" + (v === null ? '<em style="color:#94a3b8;">NULL</em>' : esc(v)) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div></div>";
  }
  $("sqlResult").innerHTML = html || '<div class="card"><div class="empty">没有可展示的结果。</div></div>';
}
var sqlClarifyOrig = null; // 待澄清的原问题（模型返回 clarify 时保存）
function submitSql(q, clarification, isClarify) {
  var btn = isClarify ? $("sqlClarifyBtn") : $("sqlBtn");
  if (btn) { btn.disabled = true; btn.textContent = "查询中…"; }
  $("sqlResult").innerHTML = loading("正在选择数据表…");
  var payload = { question: q };
  if (clarification) payload.clarification = clarification;
  streamSSE("/ask/stream", authHeaders({ "Content-Type": "application/json" }), payload, {
    status: function (d) { $("sqlResult").innerHTML = loading(d.message || "处理中…"); },
    final: renderSql,
    error: function (msg) {
      $("sqlResult").innerHTML = '<div class="card"><div class="error">请求失败：' + esc(msg) + "</div></div>";
    }
  })
    .catch(function (e) { $("sqlResult").innerHTML = '<div class="card"><div class="error">请求失败：' + esc(e.message) + "</div></div>"; })
    .finally(function () { if (btn) { btn.disabled = false; btn.textContent = isClarify ? "提交补充" : "提 问"; } });
}
function askSql() {
  var q = $("sqlQ").value.trim(); if (!q) { $("sqlQ").focus(); return; }
  pushHist("sql_history", q);
  submitSql(q, "", false);
}
function askSqlClarify() {
  var reply = $("sqlClarifyInput").value.trim();
  if (!reply) { $("sqlClarifyInput").focus(); return; }
  if (!sqlClarifyOrig) return; // 没有待澄清原问题，忽略
  submitSql(sqlClarifyOrig, reply, true);
}

/* ============ 面板 2：知识问答（RAG） ============ */
function renderRag(data) {
  var html = "";
  if (data.error) html += '<div class="card"><div class="error">' + esc(data.error) + "</div></div>";
  if (data.answer) {
    html += '<div class="card"><div class="card-head"><h3>回答</h3><button class="mini-btn" onclick="copyAnswer(this)">复制</button></div><div class="answer">' + esc(data.answer) + "</div>";
    // 会话记忆提示：来源、改写理解、已记住轮数
    if (data.from_memory) {
      html += '<div class="hint">来源：对话记忆（非文档检索）</div>';
    } else if (data.rewritten_question) {
      html += '<div class="hint">结合上文，检索理解为：' + esc(data.rewritten_question) + "</div>";
    }
    if (data.memory_turns) {
      html += '<div class="hint">本会话已记住 ' + data.memory_turns + ' 轮</div>';
      updateMemInfo("ragMemInfo", data.memory_turns);
    }
    if (data.citations && data.citations.length) {
      html += '<div class="cite"><b>引用</b>';
      data.citations.forEach(function (c) {
        var label, file = "";
        if (typeof c === "string") { label = c; }
        else {
          label = c.file || c.source || "未知";
          file = c.file || c.source || "";
          if (typeof c.page === "number") label += " · 第" + c.page + "页";
          if (c.heading) label += " · " + c.heading;
          if (c.doc_date) label += "（" + c.doc_date + "）";
          else if (c.doc_version) label += "（" + c.doc_version + "）";
        }
        if (file) {
          html += '<button class="cite-btn" type="button" data-file="' + esc(file) +
                  '" data-chunk="' + (typeof c.chunk === "number" ? c.chunk : "") + '">' +
                  esc(label) + "</button>";
        } else {
          html += "<span>" + esc(label) + "</span>";
        }
      });
      html += "</div>";
    }
    html += "</div>";
    // 裁判重试耗尽时后端返回 reflection.passed=false：展示校验警示条
    if (data.reflection && data.reflection.passed === false) {
      html += '<div class="card"><div class="warn">⚠️ 该回答未完全通过事实验证，请对照引用来源谨慎采信</div></div>';
    }
  }
  $("ragResult").innerHTML = html || '<div class="card"><div class="empty">没有可展示的结果。</div></div>';
  // 引用点击 → 在下方知识库文档面板展开对应分块并高亮
  Array.prototype.forEach.call($("ragResult").querySelectorAll(".cite-btn"), function (b) {
    b.addEventListener("click", function () {
      openCitation(b.getAttribute("data-file"), b.getAttribute("data-chunk"));
    });
  });
}
function askRag() {
  var q = $("ragQ").value.trim(); if (!q) { $("ragQ").focus(); return; }
  pushHist("rag_history", q);
  var btn = $("ragBtn"); btn.disabled = true; btn.textContent = "问答中…";
  $("ragResult").innerHTML = loading("正在检索知识库…");
  streamSSE("/rag/chat/stream", authHeaders({ "Content-Type": "application/json" }), { question: q }, {
    status: function (d) { $("ragResult").innerHTML = loading(d.message || "处理中…"); },
    final: renderRag,
    error: function (msg) {
      $("ragResult").innerHTML = '<div class="card"><div class="error">请求失败：' + esc(msg) + "</div></div>";
    }
  })
    .catch(function (e) { $("ragResult").innerHTML = '<div class="card"><div class="error">请求失败：' + esc(e.message) + "</div></div>"; })
    .finally(function () { btn.disabled = false; btn.textContent = "提 问"; });
}
/* ---------- 上传分流：按内容识别，展示依据，用户可确认或改判 ---------- */
var MAX_UPLOAD_MB = 50;  // 与后端 MAX_UPLOAD_MB 保持一致

function uploadCardEl(tab) { return tab === "sql" ? $("dataUploadCard") : $("ragUploadCard"); }

function uploadBox(text, bad) {
  return '<div class="card" style="padding:12px 14px;margin:0;"><div class="' +
    (bad ? "error" : "hint") + '" style="white-space:pre-wrap;">' + esc(text) + "</div></div>";
}

function classifyHint(c) {
  var kinds = { structured: "识别为数据表", document: "识别为文档",
                database: "识别为数据库", unknown: "未能确定类型" };
  var conf = { high: "把握高", medium: "把握中", low: "把握低" };
  return (kinds[c.kind] || "未能确定类型") + "（" + (conf[c.confidence] || "") + "）";
}

function renderClassifyCard(tab, c, file) {
  var el = uploadCardEl(tab);
  var reasons = (c.reasons || []).map(function (r) { return "· " + r; }).join("\n");
  var html = '<div class="card" style="padding:12px 14px;margin:0;">' +
    "<h3>" + esc(classifyHint(c)) + "</h3>" +
    '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7;">' + esc(reasons) + "</div>" +
    '<div class="hint" style="margin-top:6px;">文件：' + esc(file.name) + "（" +
      (file.size / 1024).toFixed(1) + " KB）</div>";
  if (c.kind === "database") {
    html += '<div class="row" style="margin-top:10px;">' +
      '<button class="btn" type="button" data-act="db">接入为数据源</button>' +
      '<button class="btn gray small" type="button" data-act="cancel">取消</button></div></div>';
  } else if (c.kind === "unknown") {
    html += '<div class="hint" style="margin-top:8px;">无法确定处理方式，请手动选择：</div>' +
      '<div class="row" style="margin-top:8px;">' +
      '<button class="btn gray small" type="button" data-act="kb">存入知识库</button>' +
      '<button class="btn gray small" type="button" data-act="data">导入数据表</button>' +
      '<button class="btn gray small" type="button" data-act="cancel">取消</button></div></div>';
  } else {
    var primary = c.route === "data" ? "data" : "kb";
    var primaryText = primary === "data" ? "导入数据表" : "存入知识库";
    var alt = primary === "data" ? "kb" : "data";
    var altText = primary === "data" ? "改判：存入知识库" : "改判：导入数据表";
    html += '<div class="row" style="margin-top:10px;">' +
      '<button class="btn" type="button" data-act="' + primary + '">' + primaryText + "</button>" +
      '<button class="btn gray small" type="button" data-act="' + alt + '">' + altText + "</button>" +
      '<button class="btn gray small" type="button" data-act="cancel">取消</button></div></div>';
  }
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll("[data-act]"), function (b) {
    b.addEventListener("click", function () {
      var act = b.getAttribute("data-act");
      if (act === "cancel") { el.innerHTML = ""; return; }
      if (act === "db") { connectSqliteFile(file, tab); return; }
      if (act === "kb") { kbIngest(file, tab); return; }
      if (act === "data") { importDataFile(file, tab); }
    });
  });
}

function startClassify(tab, file) {
  if (!file) {
    if (tab === "sql") $("dsMsg").textContent = "请先选择文件";
    else $("ragIngestMsg").textContent = "请先选择文件";
    return;
  }
  if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
    uploadCardEl(tab).innerHTML = uploadBox(
      "文件 " + (file.size / 1024 / 1024).toFixed(1) + "MB 超过上限 " +
      MAX_UPLOAD_MB + "MB，请压缩或拆分后再上传", true);
    return;
  }
  uploadCardEl(tab).innerHTML = uploadBox("正在识别文件类型…");
  var fd = new FormData();
  fd.append("file", file);
  apiJson("/ingest/classify", { method: "POST", body: fd })
    .then(function (c) { renderClassifyCard(tab, c, file); })
    .catch(function (e) { uploadCardEl(tab).innerHTML = uploadBox("识别失败：" + e.message, true); });
}

/* 知识问答：解析中 → 已入库 N 个分块（过程不对用户暴露） */
function kbCard(tab, text, bad) {
  var el = uploadCardEl(tab);
  el.innerHTML = uploadBox(text, bad);
  return el;
}
function kbIngest(file, tab) {
  var el = kbCard(tab, "解析中…");
  apiJson("/rag/documents")
    .then(function (d) {
      var exists = (d.documents || []).some(function (x) { return x.source === file.name; });
      if (!exists) { kbUpload(file, tab, false); return; }
      el.innerHTML = '<div class="card" style="padding:12px 14px;margin:0;">' +
        '<div class="hint">知识库已有同名文档「' + esc(file.name) + "」，是否覆盖？</div>" +
        '<div class="row" style="margin-top:8px;">' +
        '<button class="btn" type="button" data-act="replace">覆盖并入库</button>' +
        '<button class="btn gray small" type="button" data-act="cancel">取消</button></div></div>';
      el.querySelector("[data-act=replace]").addEventListener("click", function () {
        kbUpload(file, tab, true);
      });
      el.querySelector("[data-act=cancel]").addEventListener("click", function () {
        el.innerHTML = "";
      });
    })
    .catch(function () { kbUpload(file, tab, false); });
}
function kbUpload(file, tab, replace) {
  kbCard(tab, "解析中…");
  var large = file.size >= 10 * 1024 * 1024;   // 与后端异步阈值一致
  var fd = new FormData();
  fd.append("file", file);
  if (replace) fd.append("replace", "true");
  var dd = $("ragDocDate") ? $("ragDocDate").value : "";
  var dv = $("ragDocVersion") ? $("ragDocVersion").value.trim() : "";
  if (dd) fd.append("doc_date", dd);
  if (dv) fd.append("doc_version", dv);
  if (large) {
    apiJson("/rag/ingest/async", { method: "POST", body: fd })
      .then(function (t) { pollKbTask(t.task_id, tab); })
      .catch(function (e) { kbCard(tab, "入库失败：" + e.message, true); });
    return;
  }
  apiJson("/rag/ingest", { method: "POST", body: fd })
    .then(function (d) {
      kbCard(tab, "已入库 " + d.chunks + " 个分块（" + d.filename + "）" +
        (d.replaced ? "，已替换旧版" : ""));
      if ($("ragFile")) $("ragFile").value = "";
      loadRagDocs();
      refreshStatusBar();
    })
    .catch(function (e) { kbCard(tab, "入库失败：" + e.message, true); });
}
function pollKbTask(taskId, tab) {
  apiJson("/rag/tasks/" + taskId)
    .then(function (t) {
      if (t.status !== "completed") {
        kbCard(tab, "解析中…" + (t.stage ? "（" + t.stage + "）" : ""));
        setTimeout(function () { pollKbTask(taskId, tab); }, 1000);
        return;
      }
      if (t.failed && t.failed.length) {
        kbCard(tab, "入库失败：" + t.failed[0].error, true);
        return;
      }
      var first = (t.results || [])[0] || {};
      kbCard(tab, "已入库 " + (first.chunks || 0) + " 个分块（" + (first.source || "文件") + "）");
      loadRagDocs();
    })
    .catch(function (e) { kbCard(tab, "查询进度失败：" + e.message, true); });
}

/* ---------- 批量导入：文件夹选择 + 异步任务轮询 ---------- */
function startBatchIngest() {
  var input = $("ragFolder");
  var btn = $("ragBatchBtn"), msg = $("ragBatchMsg");
  var files = Array.prototype.slice.call(input.files || []);
  if (!files.length) { msg.textContent = "请先选择文件夹"; return; }
  btn.disabled = true; btn.textContent = "上传中…";
  msg.textContent = "已选择 " + files.length + " 个文件，上传中…";

  var fd = new FormData();
  fd.append("replace", "false");
  files.forEach(function (f) { fd.append("files", f, f.name); });

  apiJson("/rag/ingest/batch", {
    method: "POST",
    body: fd,
  })
    .then(function (d) {
      msg.textContent = "任务已受理：" + d.total + " 份（受理 " + d.accepted +
        "，拒收 " + d.rejected + "），后台处理中…";
      pollBatchTask(d.task_id, msg, btn, input);
    })
    .catch(function (e) {
      msg.textContent = "批量导入失败：" + e.message;
      resetBatchBtn(btn, input);
    });
}

function pollBatchTask(taskId, msg, btn, input) {
  apiJson("/rag/tasks/" + taskId)
    .then(function (t) {
      var line = "进度 " + t.done + "/" + t.total;
      if (t.current) line += "，当前：" + t.current;
      msg.textContent = line;
      if (t.status !== "completed") {
        setTimeout(function () { pollBatchTask(taskId, msg, btn, input); }, 1000);
        return;
      }
      var okCount = (t.results || []).length, failCount = (t.failed || []).length;
      var text = "批量导入完成：成功 " + okCount + " 份";
      if (failCount) {
        text += "，失败 " + failCount + " 份：" +
          t.failed.map(function (x) { return x.source + "（" + x.error + "）"; }).join("；");
      }
      msg.textContent = text;
      resetBatchBtn(btn, input);
      loadRagDocs();
    })
    .catch(function (e) {
      msg.textContent = "查询进度失败：" + e.message;
      resetBatchBtn(btn, input);
    });
}

function resetBatchBtn(btn, input) {
  btn.disabled = false;
  btn.textContent = "批量导入";
  input.value = "";
}

/* ---------- 知识库文档管理：列表 / 分块 / 删除 ---------- */
var RAG_CHUNK_LIMIT = 20;      // 分块预览每页条数（后端 limit 上限 50）
var ragChunkState = {};        // source -> {offset, total, limit}

function docMetaText(d) {
  var parts = [];
  if (d.doc_version) parts.push("版本 " + d.doc_version);
  if (d.doc_date) parts.push("文档日期 " + d.doc_date);
  if (d.ingested_at) parts.push("入库 " + String(d.ingested_at).replace("T", " "));
  parts.push(d.chunks + " 块" + (d.parents > 0 ? "（父块 " + d.parents + "）" : ""));
  if (d.max_page > 0) parts.push("≤" + d.max_page + " 页");
  return parts.join(" · ");
}

function chunkTypeLabel(t) {
  if (t === "parent") return "父块";
  if (t === "child") return "小块";
  return "块";
}

function findDocBtn(name) {
  var btns = document.querySelectorAll(".doc-name-btn");
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute("data-name") === name) return btns[i];
  }
  return null;
}

function renderRagDocs(docs) {
  var el = $("ragDocs");
  if (!docs.length) {
    el.innerHTML = '<span class="hint">当前账号 ' + esc(userId()) +
      ' 的知识库为空（文档按账号隔离，请确认上传时使用的账号）。</span>';
    return;
  }
  el.innerHTML = docs.map(function (d) {
    return '<div class="doc-item">' +
             '<div class="doc-main">' +
               '<button class="doc-name-btn" type="button" data-name="' + esc(d.source) + '">' +
                 '<span class="caret">▸</span>' + esc(d.source) + '</button>' +
               '<span class="doc-meta-line">' + esc(docMetaText(d)) + '</span>' +
             '</div>' +
             '<button class="doc-del" type="button" data-name="' + esc(d.source) + '">删除</button>' +
           '</div>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".doc-name-btn"), function (b) {
    b.addEventListener("click", function () {
      toggleDocChunks(b.getAttribute("data-name"), b);
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll(".doc-del"), function (b) {
    b.addEventListener("click", function () { deleteRagDoc(b.getAttribute("data-name"), b); });
  });
}

function toggleDocChunks(name, btn) {
  var item = btn.closest(".doc-item");
  var box = item.nextElementSibling;
  if (box && box.classList && box.classList.contains("doc-chunks")) {
    item.parentNode.removeChild(box);
    var caret = btn.querySelector(".caret");
    if (caret) caret.textContent = "▸";
    return;
  }
  var caret = btn.querySelector(".caret");
  if (caret) caret.textContent = "▾";
  box = document.createElement("div");
  box.className = "doc-chunks";
  box.setAttribute("data-source", name);
  box.innerHTML = '<div class="chunk-list"><span class="hint">加载中…</span></div>';
  item.parentNode.insertBefore(box, item.nextSibling);
  loadChunks(name, 0, box, null);
}

function loadChunks(name, offset, box, highlightIdx) {
  var list = box.querySelector(".chunk-list");
  if (list) list.innerHTML = '<span class="hint">加载中…</span>';
  // source 走查询参数：文件名可能含 "/"、"#"、"?"，放进路径会被截断
  var url = "/rag/documents/chunks?source=" + encodeURIComponent(name) +
    "&offset=" + offset + "&limit=" + RAG_CHUNK_LIMIT;
  apiFetch(url)
    .then(function (r) {
      if (r.status === 404) throw new Error("该文档不在当前账号的知识库中");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (d) { renderChunks(name, d, box, highlightIdx); })
    .catch(function (e) {
      box.innerHTML = '<span class="hint">分块加载失败：' + esc(e.message) + "</span>";
    });
}

function renderChunks(name, d, box, highlightIdx) {
  ragChunkState[name] = { offset: d.offset, total: d.total, limit: d.limit };
  var html = '<div class="chunk-list">';
  if (!d.chunks.length) html += '<span class="hint">没有分块</span>';
  d.chunks.forEach(function (c) {
    var meta = [];
    if (c.page) meta.push("第" + c.page + "页");
    if (c.heading) meta.push(c.heading);
    meta.push(c.chars + " 字");
    var no = c.chunk_type === "parent"
      ? ("父块 P" + c.chunk_index)
      : ("#" + c.chunk_index + " · " + chunkTypeLabel(c.chunk_type));
    html += '<div class="chunk-item" data-idx="' + c.chunk_index + '" data-type="' + esc(c.chunk_type) + '">' +
              '<div class="chunk-head"><span class="chunk-no">' + no + '</span><span>' +
                esc(meta.join(" · ")) + '</span></div>' +
              '<div class="chunk-text">' + esc(c.preview) + '</div>' +
            '</div>';
  });
  html += "</div>";
  var pages = Math.max(1, Math.ceil(d.total / d.limit));
  var cur = Math.floor(d.offset / d.limit) + 1;
  html += '<div class="chunk-pager">' +
            '<button class="mini-btn chunk-prev" type="button"' + (cur <= 1 ? " disabled" : "") + '>上一页</button>' +
            '<span>第 ' + cur + " / " + pages + ' 页（共 ' + d.total + ' 块）</span>' +
            '<button class="mini-btn chunk-next" type="button"' + (cur >= pages ? " disabled" : "") + '>下一页</button>' +
          '</div>';
  box.innerHTML = html;

  var prev = box.querySelector(".chunk-prev"), next = box.querySelector(".chunk-next");
  if (prev) prev.addEventListener("click", function () { loadChunks(name, Math.max(0, d.offset - d.limit), box, null); });
  if (next) next.addEventListener("click", function () { loadChunks(name, d.offset + d.limit, box, null); });

  if (highlightIdx !== null && highlightIdx !== undefined && highlightIdx !== "") {
    var target = null;
    Array.prototype.forEach.call(box.querySelectorAll(".chunk-item"), function (el) {
      if (Number(el.getAttribute("data-idx")) === Number(highlightIdx) &&
          el.getAttribute("data-type") !== "parent") target = el;
    });
    if (target) {
      target.classList.add("hit");
      target.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }
}

/* 引用点击：展开对应文档分块，并跳到该分块所在页高亮 */
function openCitation(file, chunkIdx) {
  if (!file) return;
  var btn = findDocBtn(file);
  if (!btn) {
    loadRagDocs().then(function () {
      if (findDocBtn(file)) { openCitation(file, chunkIdx); return; }
      var el = $("ragDocs");
      if (el) el.insertAdjacentHTML("afterbegin",
        '<span class="hint">引用的文档“' + esc(file) + '”不在当前账号的知识库中。</span>');
    });
    return;
  }
  var item = btn.closest(".doc-item");
  var box = item.nextElementSibling;
  if (!box || !box.classList || !box.classList.contains("doc-chunks")) {
    var caret = btn.querySelector(".caret");
    if (caret) caret.textContent = "▾";
    box = document.createElement("div");
    box.className = "doc-chunks";
    box.setAttribute("data-source", file);
    item.parentNode.insertBefore(box, item.nextSibling);
  }
  var idx = Number(chunkIdx);
  var offset = isNaN(idx) ? 0 : Math.max(0, Math.floor(idx / RAG_CHUNK_LIMIT) * RAG_CHUNK_LIMIT);
  loadChunks(file, offset, box, isNaN(idx) ? null : idx);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function loadRagDocs() {
  var el = $("ragDocs");
  if (el) el.innerHTML = '<span class="hint">加载中…</span>';
  return apiJson("/rag/documents")
    .then(function (d) { renderRagDocs(d.documents || []); })
    .catch(function () { if (el) el.innerHTML = '<span class="hint">文档列表加载失败</span>'; });
}
function resetDelBtn(btn) {
  clearTimeout(btn._timer);
  btn.dataset.confirm = "";
  btn.disabled = false;
  btn.textContent = "删除";
}
function deleteRagDoc(name, btn) {
  // 第一步：页面内二次确认（不依赖 window.confirm，兼容内置预览浏览器）
  if (btn.dataset.confirm !== "1") {
    btn.dataset.confirm = "1";
    btn.textContent = "确认删除？";
    clearTimeout(btn._timer);
    btn._timer = setTimeout(function () { resetDelBtn(btn); }, 5000);
    return;
  }
  // 第二步：真正执行删除
  clearTimeout(btn._timer);
  btn.disabled = true; btn.textContent = "删除中…";
  apiFetch("/rag/documents?source=" + encodeURIComponent(name), {
    method: "DELETE",
  })
    .then(function (r) {
      if (r.status === 404) { resetDelBtn(btn); loadRagDocs(); return null; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (d) { if (d) loadRagDocs(); })
    .catch(function (e) {
      resetDelBtn(btn);
      var box = $("ragDocs");
      if (box) box.insertAdjacentHTML("afterbegin",
        '<div class="card" style="padding:8px 12px;margin-bottom:8px;"><span class="error" style="color:#dc2626;font-size:13px;">删除失败：' +
        esc(e.message) + "</span></div>");
    });
}

/* ---------- 状态条与数据源：服务状态、表数量、快照日全部来自后端 ---------- */
var _dsState = null;

function badgeSet(cls, text) {
  var el = $("healthBadge");
  el.className = "badge" + (cls ? " " + cls : "");
  el.innerHTML = '<span class="dot"></span>' + text;
}

function renderStatusBar(health, ds, dsErr) {
  if (!health || (health.status !== "ok" && health.status !== "degraded")) {
    badgeSet("bad", "服务异常（后端不可用）");
    return;
  }
  var prefix = health.status === "ok" ? "服务正常" : "服务降级";
  var cls = health.status === "ok" ? "ok" : "warn";
  if (dsErr) { badgeSet("warn", prefix + " · 数据源状态读取失败"); return; }
  if (!ds || !ds.connected) {
    badgeSet("warn", prefix + " · " + ((ds && ds.state === "missing") ? "数据源文件丢失" : "未接入数据库"));
    return;
  }
  badgeSet(cls, prefix + " · " + ds.table_count + " 张表 · 快照 " + esc(ds.snapshot_date));
}

/* 数据源面板：连接信息 + 纳入/排除的表及原因（来自 /datasource/status） */
function renderDsPanel(ds) {
  _dsState = ds;
  var name = $("dsName"), meta = $("dsMeta"), box = $("dsTables");
  var body = $("dsTablesBody"), sum = $("dsTablesSummary");
  if (!ds || !ds.connected) {
    name.textContent = (ds && ds.state === "missing") ? "数据源文件不存在" : "未接入数据库";
    meta.textContent = "接入后按真实表结构问数";
    box.style.display = "none";
    return;
  }
  name.textContent = ds.filename + (ds.kind === "demo" ? "（示例库）" : "");
  meta.textContent = ds.table_count + " 张可用表 · 排除 " + ds.excluded_count + " 张 · 快照 "
    + ds.snapshot_date + "（" + (ds.snapshot_note || ds.snapshot_source) + "） · 扫描 "
    + ds.scan.duration_ms + "ms" + (ds.scan.cached ? "（缓存）" : "");
  var lines = [];
  (ds.tables || []).forEach(function (t) {
    var cols = (t.columns || []).map(function (c) { return c.name; }).join("、");
    lines.push("✓ " + t.name + "（" + (t.rows_capped ? "≥" : "") + t.rows + " 行，"
      + (t.columns || []).length + " 列）\n    " + cols);
  });
  (ds.excluded || []).forEach(function (t) {
    lines.push("✗ " + t.name + " —— 已排除：" + t.reason);
  });
  body.textContent = lines.join("\n") || "（无表）";
  sum.textContent = "表清单与排除原因（纳入 " + ds.table_count + " / 共 " + ds.total_tables + "）";
  box.style.display = "";
}

function refreshStatusBar(forceScan) {
  badgeSet("", "加载中…");
  $("dsName").textContent = "加载中…";
  $("dsMeta").textContent = "";
  $("dsTables").style.display = "none";
  var healthP = fetch("/api/health")
    .then(function (r) { return r.json(); })
    .catch(function () { return null; });
  var dsP = tokenValid()
    ? apiJson("/datasource/status" + (forceScan ? "?refresh=1" : ""))
        .catch(function (e) { return { __err: e.message }; })
    : Promise.resolve(null);
  return Promise.all([healthP, dsP]).then(function (arr) {
    var health = arr[0], ds = arr[1];
    var dsErr = !!(ds && ds.__err);
    if (dsErr) ds = null;
    renderStatusBar(health, ds, dsErr);
    if (dsErr) {
      $("dsName").textContent = "状态读取失败";
      $("dsMeta").textContent = arr[1].__err || "";
      return;
    }
    renderDsPanel(ds);
  });
}

function dsSetMsg(text, bad) {
  var el = $("dsMsg");

  el.style.color = bad ? "#c0392b" : "";
}

function connectDemo() {

function uploadSqlite(file) {

function disconnectDatasource() {

      .then(function () { if (after) after(); })

      .finally(function () { b.disabled = false; });
  });
}

  refreshStatusBar(true).then(function () { dsSetMsg("扫描已刷新"); });
});
$("dsDisconnectBtn").addEventListener("click", disconnectDatasource);

/* ---------- 登录 / 注册 / 改密 ---------- */
var _registerMode = false;
function isLoggedIn() { return tokenValid(); }
function showLogin() {
  $("pwdView").style.display = "none";
  $("loginView").style.display = ""; $("mainView").style.display = "none";
}
function showMain() {
  $("loginView").style.display = "none"; $("pwdView").style.display = "none"; $("mainView").style.display = "";
  var name = localStorage.getItem("display_name") || userId();
  $("loginBadge").innerHTML = '<span class="dot"></span>已登录：' + esc(name);
  renderHist("sql_history"); renderHist("rag_history");
  refreshStatusBar();
  refreshMemoryInfo();
}
function setAuthMode(reg) {
  _registerMode = reg;
  $("authSub").textContent = reg ? "注册新账号后自动登录" : "登录后开始使用";
  $("regConfirm").style.display = reg ? "" : "none";
  $("regDisplay").style.display = reg ? "" : "none";
  $("loginBtn").textContent = reg ? "注 册" : "登 录";
  $("modeToggle").textContent = reg ? "已有账号？登录" : "没有账号？注册";
  $("loginMsg").textContent = "";
}
/* 统一提取服务端错误：{code, detail} 或旧格式 {ok:false, error} */
function _authError(r) {
  return r.json().then(function (d) {
    throw new Error(d.detail || d.error || ("HTTP " + r.status));
  }).catch(function (e) {
    if (e instanceof Error && e.message) throw e;
    throw new Error("HTTP " + r.status);
  });
}
function doLogin() {
  var username = $("loginAccount").value.trim();
  var pwd = $("loginKey").value;
  if (!/^[A-Za-z0-9_-]{1,32}$/.test(username)) {
    $("loginMsg").textContent = "用户名仅限字母、数字、下划线、连字符（1-32 位）";
    return;
  }
  if (!pwd) { $("loginMsg").textContent = "请输入密码"; return; }
  if (_registerMode) {
    if (pwd.length < 8) { $("loginMsg").textContent = "密码至少 8 位"; return; }
    if (pwd !== $("regConfirm").value) { $("loginMsg").textContent = "两次输入的密码不一致"; return; }
  }
  $("loginMsg").textContent = _registerMode ? "注册中…" : "登录中…";
  var url = _registerMode ? "/auth/register" : "/auth/login";
  var payload = _registerMode
    ? { username: username, password: pwd, confirm_password: $("regConfirm").value, display_name: $("regDisplay").value.trim() }
    : { username: username, password: pwd };
  fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
    .then(function (r) { return r.ok ? r.json() : _authError(r); })
    .then(function (d) { return _registerMode ? _loginAfterRegister(username, pwd) : _applyLogin(d); })
    .catch(function (e) { $("loginMsg").textContent = e.message || "请求失败"; });
}
/* 注册成功后自动登录，少一步操作 */
function _loginAfterRegister(username, pwd) {
  return fetch("/auth/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: username, password: pwd })
  }).then(function (r) { return r.ok ? r.json() : _authError(r); }).then(_applyLogin);
}
function _applyLogin(d) {
  if (!d.ok || !d.token) throw new Error(d.error || "登录失败");
  _expiredOnce = false;
  localStorage.setItem("account", d.account);
  localStorage.setItem("display_name", (d.user && d.user.display_name) || "");
  localStorage.setItem("role", (d.user && d.user.role) || "user");
  localStorage.setItem("token", d.token);
  localStorage.removeItem("api_key");
  $("loginMsg").textContent = ""; $("loginKey").value = "";
  setAuthMode(false);
  showMain();
}
function doLogout(msg) {
  _expiredOnce = false;
  clearSession();
  $("loginAccount").value = ""; $("loginKey").value = "";
  $("regConfirm").value = ""; $("regDisplay").value = "";
  $("loginMsg").textContent = msg || "";
  setAuthMode(false);
  showLogin();
}
function openPwdView() {
  $("pwdOld").value = ""; $("pwdNew").value = ""; $("pwdConfirm").value = ""; $("pwdMsg").textContent = "";
  $("mainView").style.display = "none"; $("loginView").style.display = "none"; $("pwdView").style.display = "";
}
function changePassword() {
  var oldP = $("pwdOld").value, newP = $("pwdNew").value, confirmP = $("pwdConfirm").value;
  if (!oldP || !newP) { $("pwdMsg").textContent = "请填写旧密码与新密码"; return; }
  if (newP.length < 8) { $("pwdMsg").textContent = "新密码至少 8 位"; return; }
  if (newP !== confirmP) { $("pwdMsg").textContent = "两次输入的新密码不一致"; return; }
  $("pwdMsg").textContent = "提交中…";
  apiJson("/auth/password", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ old_password: oldP, new_password: newP, confirm_password: confirmP })
  }).then(function () {
    doLogout("密码已修改，请用新密码重新登录");
  }).catch(function (e) { $("pwdMsg").textContent = e.message || "修改失败"; });
}

/* 登录/登出事件 */
$("loginBtn").addEventListener("click", doLogin);
$("modeToggle").addEventListener("click", function () { setAuthMode(!_registerMode); });
$("loginAccount").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
$("loginKey").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
$("regConfirm").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
$("logoutBtn").addEventListener("click", function () { doLogout(""); });
$("changePwdBtn").addEventListener("click", openPwdView);
$("pwdBtn").addEventListener("click", changePassword);
$("pwdCancel").addEventListener("click", function () { $("pwdView").style.display = "none"; showMain(); });

/* 初始化：本地令牌先校验 exp，再向 /auth/me 确认账号仍有效（被禁用/改密会自动回登录页） */
(function initAuth() {
  if (!isLoggedIn()) {
    var hadLogin = !!authToken() || !!localStorage.getItem("account");
    clearSession();
    showLogin();
    if (hadLogin) $("loginMsg").textContent = "登录已过期，请重新登录";
    return;
  }
  apiFetch("/auth/me").then(function (r) { return r.json(); }).then(function (d) {
    _expiredOnce = false;
    localStorage.setItem("account", d.user.username);
    localStorage.setItem("display_name", d.user.display_name || "");
    localStorage.setItem("role", d.user.role || "user");
    showMain();
  }).catch(function () {
    if (!tokenValid()) showLogin();
  });
})();
</script>
</body>
