  - id: B03
    module: 边界/部门
    question: 各部门本月准时交付率分别是多少？如果出货数据没有部门归属，就按客户给出。
    expected_tables: [fact_shipment]
    expected_points: ["瑞芯微", "0.625", "中兴微电子", "0.1111", "韦尔股份豪威", "0.2778"]
    result_mode: exact
    expect: clarify_or_answer
    note_points: ["无部门或没有部门或不含部门或无部门字段"]
    judge: OTD 无部门字段；澄清 或 按客户给出本月 OTD（result_match）均算命中，回答时须注明无部门
    gold_sql: |
      SELECT c.customer_name, COUNT(*) AS ship_cnt,
             SUM(CASE WHEN s.ship_date<=d.due_date THEN 1 ELSE 0 END) AS on_time_cnt,
             ROUND(SUM(CASE WHEN s.ship_date<=d.due_date THEN 1 ELSE 0 END)*1.0/COUNT(*),4) AS otd
      FROM fact_shipment s
      JOIN (SELECT order_id, MIN(due_date) AS due_date FROM fact_sales_order_item GROUP BY order_id) d
        ON d.order_id=s.order_id
      JOIN fact_sales_order o ON o.order_id=s.order_id
      JOIN dim_customer c ON c.customer_id=o.customer_id
      WHERE s.ship_date >= date('2026-09-24','start of month')
      GROUP BY c.customer_id, c.customer_name ORDER BY otd DESC

