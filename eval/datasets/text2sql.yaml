# Text2SQL 评测集（51 条 = 47 可执行/可判定 + 4 边界）
# 指标：
#   - 执行成功率：守卫通过且 SQL 在只读库执行成功 / 全部题
#   - 结果集一致率：模型结果与 gold_sql 结果集逐行比对（不比对 SQL 字符串）
#       exact    ：行数一致，且基准行全部取值都能在模型对应行中找到（允许多展示列）
#       first_row：只比第一行（用于“第一名 / 最差 / Top1”类问法）
#   - 澄清命中：expect=clarify 的题必须发起澄清；expect=refuse 的题必须拒绝
#   - 口径改写：expect=clarify_or_answer 的题，澄清 或 按替代维度答对（result_match）均算命中
#   - 口径注明：note_points 非空时，回答的口径说明必须命中其中任一说法（规则判定，不做模型打分）
# 口径题归类：
#   - E39–E46 为 8 道部门口径应答题；B03/B04 为“无部门字段”澄清/改口径边界题；
#   - B05（部门 RTY）因有唯一正确结果集（部门 FPY），计入 47 道应答题，
#     其“非 17 站连乘”的说明要求单独用 note_points 判定。
# 说明：
#   - gold_sql 已在 data/db/ic_substrate.db 只读实测，与既有 expected_points 一致
#   - expected_points 沿用阶段 E 题库的“规则判定要点”，用于结果内容核对
#   - expected_tables 用于 schema linking 命中率参考（不参与主指标）
meta:
  anchor_date: "2026-09-24"
  snapshot_date: "2026-09-24"

