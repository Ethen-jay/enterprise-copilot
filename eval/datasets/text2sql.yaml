  - id: E06
    module: 质量/RTY
    question: 工单260600002的整体RTY是多少？
    expected_tables: [fact_process_record, fact_work_order]
    expected_points: ["0.707或0.7070"]
    result_mode: exact
    expect: answer
    gold_sql: |
      WITH f AS (
        SELECT process_id, good_panels*1.0/input_panels AS f
        FROM fact_process_record WHERE lot_id='260600002' AND is_rework_pass=0
      )
      SELECT MAX(CASE WHEN process_id='P01' THEN f END)*MAX(CASE WHEN process_id='P02' THEN f END)
           * MAX(CASE WHEN process_id='P03' THEN f END)*MAX(CASE WHEN process_id='P04' THEN f END)
           * MAX(CASE WHEN process_id='P05' THEN f END)*MAX(CASE WHEN process_id='P06' THEN f END)
           * MAX(CASE WHEN process_id='P07' THEN f END)*MAX(CASE WHEN process_id='P08' THEN f END)
           * MAX(CASE WHEN process_id='P09' THEN f END)*MAX(CASE WHEN process_id='P10' THEN f END)
           * MAX(CASE WHEN process_id='P11' THEN f END)*MAX(CASE WHEN process_id='P12' THEN f END)
           * MAX(CASE WHEN process_id='P13' THEN f END)*MAX(CASE WHEN process_id='P14' THEN f END)
           * MAX(CASE WHEN process_id='P15' THEN f END)*MAX(CASE WHEN process_id='P16' THEN f END)
           * MAX(CASE WHEN process_id='P17' THEN f END) AS rty
      FROM f HAVING COUNT(DISTINCT process_id)=17
  - id: E07
    module: 质量/RTY
    question: 全部已完工批次的整体RTY平均值和中位数是多少？
    expected_tables: [fact_process_record, fact_work_order]
    expected_points: ["0.8179", "0.8237"]
    result_mode: exact
    expect: answer
    gold_sql: |
      WITH fpy AS (
        SELECT p.lot_id, p.process_id, p.good_panels*1.0/p.input_panels AS f
        FROM fact_process_record p JOIN fact_work_order w ON w.lot_id=p.lot_id
        WHERE w.lot_status='已完工' AND p.is_rework_pass=0
      ), lot_rty AS (
        SELECT lot_id,
               MAX(CASE WHEN process_id='P01' THEN f END)*MAX(CASE WHEN process_id='P02' THEN f END)
             * MAX(CASE WHEN process_id='P03' THEN f END)*MAX(CASE WHEN process_id='P04' THEN f END)
             * MAX(CASE WHEN process_id='P05' THEN f END)*MAX(CASE WHEN process_id='P06' THEN f END)
             * MAX(CASE WHEN process_id='P07' THEN f END)*MAX(CASE WHEN process_id='P08' THEN f END)
             * MAX(CASE WHEN process_id='P09' THEN f END)*MAX(CASE WHEN process_id='P10' THEN f END)
             * MAX(CASE WHEN process_id='P11' THEN f END)*MAX(CASE WHEN process_id='P12' THEN f END)
             * MAX(CASE WHEN process_id='P13' THEN f END)*MAX(CASE WHEN process_id='P14' THEN f END)
             * MAX(CASE WHEN process_id='P15' THEN f END)*MAX(CASE WHEN process_id='P16' THEN f END)
             * MAX(CASE WHEN process_id='P17' THEN f END) AS rty
        FROM fpy GROUP BY lot_id HAVING COUNT(DISTINCT process_id)=17
      ), ordered AS (
        SELECT rty, ROW_NUMBER() OVER (ORDER BY rty) rn, COUNT(*) OVER () n FROM lot_rty
      ), mid AS (SELECT rty FROM ordered WHERE rn IN ((n+1)/2,(n+2)/2))
      SELECT ROUND(AVG(rty),4) AS avg_rty, ROUND((SELECT AVG(rty) FROM mid),4) AS median_rty FROM lot_rty
  - id: E08
    module: 质量/RTY
    question: FCBGA和FCCSP两类产品的RTY分别是多少？
    expected_tables: [fact_process_record, fact_work_order, dim_product]
    expected_points: ["FCBGA", "0.8025", "FCCSP", "0.8305"]
    result_mode: exact
    expect: answer
    gold_sql: |
      WITH fpy AS (
        SELECT p.lot_id, p.process_id, p.good_panels*1.0/p.input_panels AS f
        FROM fact_process_record p JOIN fact_work_order w ON w.lot_id=p.lot_id
        WHERE w.lot_status='已完工' AND p.is_rework_pass=0
      ), lot_rty AS (
        SELECT lot_id,
               MAX(CASE WHEN process_id='P01' THEN f END)*MAX(CASE WHEN process_id='P02' THEN f END)
             * MAX(CASE WHEN process_id='P03' THEN f END)*MAX(CASE WHEN process_id='P04' THEN f END)
             * MAX(CASE WHEN process_id='P05' THEN f END)*MAX(CASE WHEN process_id='P06' THEN f END)
             * MAX(CASE WHEN process_id='P07' THEN f END)*MAX(CASE WHEN process_id='P08' THEN f END)
             * MAX(CASE WHEN process_id='P09' THEN f END)*MAX(CASE WHEN process_id='P10' THEN f END)
             * MAX(CASE WHEN process_id='P11' THEN f END)*MAX(CASE WHEN process_id='P12' THEN f END)
             * MAX(CASE WHEN process_id='P13' THEN f END)*MAX(CASE WHEN process_id='P14' THEN f END)
             * MAX(CASE WHEN process_id='P15' THEN f END)*MAX(CASE WHEN process_id='P16' THEN f END)
             * MAX(CASE WHEN process_id='P17' THEN f END) AS rty
        FROM fpy GROUP BY lot_id HAVING COUNT(DISTINCT process_id)=17
      )
      SELECT pr.product_type, ROUND(AVG(r.rty),4) AS avg_rty
      FROM lot_rty r JOIN fact_work_order w ON w.lot_id=r.lot_id
      JOIN dim_product pr ON pr.product_id=w.product_id
      WHERE pr.product_type IN ('FCBGA','FCCSP')
      GROUP BY pr.product_type ORDER BY avg_rty DESC
