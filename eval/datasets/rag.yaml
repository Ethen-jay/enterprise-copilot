# RAG 评测集
# 说明：
#   - expected_sources：期望命中的文档（任一命中即算命中；用于 Recall@K 与引用命中率）
#   - key_points：答案必须覆盖的要点；同一要点内用「或」分隔等价写法；数字按 1% 相对误差核对
#   - should_refuse：该问题是否应当拒答
#   - 题库内容全部来自已入库文档（中文测试文档.md / benchmark_test.md / output_docx_to_markdown.md）
meta:
  user: Ethen
  top_k: 3
  note: "文档名按 basename 匹配；Retrieval Recall@K 与引用命中率均按文档级判定"

cases:
  # ---------- 北斗卫星导航系统（中文测试文档.md / benchmark_test.md） ----------
  - id: R01
    question: 北斗卫星导航系统是继哪两个系统之后的第三个成熟的卫星导航系统？
    expected_sources: [中文测试文档.md, benchmark_test.md]
    key_points: [GPS, GLONASS, 第三]
    should_refuse: false
  - id: R02
    question: 北斗系统的建设是从哪一年开始的？
    expected_sources: [中文测试文档.md]
    key_points: [1994]
    should_refuse: false
